<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SpamGuard AI</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="logo" id="secret-toggle" style="cursor: pointer; border-radius: 50%; padding: 2px;">🛡️</span>
      <span class="title">SpamGuard AI</span>
    </div>

    <div class="status-banner">
      <span class="status-dot"></span>
      <strong>Auto-Shield Active:</strong> Real-time Gmail protection is monitoring your inbox.
    </div>

    <button id="checkBtn" class="main-btn">Analyze Focused Email</button>

    <div id="loading" class="loading-spinner">
      <div class="spinner"></div>
      <div style="margin-top: 10px; font-size: 13px; color: var(--text-secondary);">Consulting Probabilistic Engine...</div>
    </div>

    <div id="error" style="color: #ef4444; font-size: 12px; margin-top: 12px; display: none; text-align: center;"></div>

    <div id="result-card">
      <div id="pred-badge" class="badge"></div>
      
      <div class="metrics-grid">
        <div class="metric-item">
          <div class="metric-label">Confidence</div>
          <div id="conf-val" class="metric-value">0%</div>
        </div>
        <div class="metric-item">
          <div class="metric-label">P(Spam)</div>
          <div id="spam-prob" class="metric-value">0.00</div>
        </div>
      </div>

      <div class="settings-group" style="margin-top: 16px; padding: 12px;">
        <div class="metric-label" style="margin-bottom: 8px;">Analysis Result</div>
        <div id="explanation-text" style="font-size: 12px; color: var(--text-secondary); line-height: 1.4;"></div>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-header">
        <span class="settings-title">Ham Decision Threshold</span>
        <span id="threshold-val" style="font-size: 13px; font-weight: 600; color: var(--accent-blue);">0.65</span>
      </div>
      <input type="range" id="threshold-slider" min="0.5" max="0.99" step="0.01" value="0.65">
      <div style="font-size: 11px; color: var(--text-secondary); margin-top: 8px;">
        Higher threshold makes the filter more aggressive.
      </div>
    </div>

    <div class="footer">
      Powered by Multinomial Naïve Bayes v2.1
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
